name: Probing site report
description: A website that triggers large OPFS truncate probes
labels: [site-report]
body:
  - type: markdown
    attributes:
      value: Reports help track how widespread this is. Please don't include personal data, account pages or session URLs.
  - type: input
    id: site
    attributes:
      label: Site (origin only)
      placeholder: https://www.example.com
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The OPFS Guard log entries (Settings → Export log), or free-space.log lines from diagnostics.
      render: text
    validations: { required: true }
  - type: input
    id: date
    attributes:
      label: Date observed
